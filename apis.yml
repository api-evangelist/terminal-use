aid: terminal-use
name: Terminal Use
description: >-
  Terminal Use is a deployment and orchestration platform for background AI
  agents — "Vercel for background agents." It gives agents that need long-lived
  task state, persistent files at /workspace, and production deployment
  primitives (versions, rollback, logs, environment secrets) a single runtime
  model and one deploy flow. Teams write agent code in Python with the
  AgentServer runtime, ship it with the tu CLI, then call deployed agents from
  their own app with the Python or TypeScript SDKs (including a Vercel AI SDK
  provider for streaming chat UIs). The platform is model- and framework-
  agnostic — run the Claude Agent SDK, Codex SDK, or your own framework inside
  sandboxed compute with forkable, shareable filesystems. The HTTP API exposes
  namespaces, projects, agents, branches, versions, tasks, events, messages,
  state, filesystems, schedules, secrets, API keys, and webhook keys. Terminal
  Use is a Y Combinator (W26) company founded by Vivek Raja, Filip Balucha, and
  Stavros Filosidis.
